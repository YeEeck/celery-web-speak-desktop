<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选择应用音频</title>
    <link rel="stylesheet" href="application-audio-picker.css" />
  </head>
  <body>
    <header class="picker-titlebar">
      <span>选择应用音频</span>
      <button id="close-picker" class="titlebar-close" type="button" aria-label="关闭">×</button>
    </header>
    <main>
      <div class="picker-heading">
        <h1>选择应用窗口</h1>
        <button id="refresh" class="icon-button" type="button" aria-label="刷新窗口列表" title="刷新窗口列表">↻</button>
      </div>
      <div id="status" class="status" role="status">正在查找窗口...</div>
      <div id="sources" class="source-grid" role="listbox" aria-label="应用窗口"></div>
    </main>
    <footer>
      <button id="cancel" class="button secondary" type="button">取消</button>
      <button id="share" class="button primary" type="button" disabled>共享音频</button>
    </footer>
    <script src="application-audio-picker.js"></script>
  </body>
</html>
