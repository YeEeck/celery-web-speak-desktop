<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>Celery Web Speak</title>
    <link rel="stylesheet" href="./window-chrome.css" />
    <link rel="stylesheet" href="./setup.css" />
  </head>
  <body>
    <header class="window-titlebar" aria-label="应用标题栏">
      <div class="window-titlebar-brand">
        <span class="window-titlebar-mark" aria-hidden="true">C</span>
        <span class="window-titlebar-name">Celery Web Speak</span>
      </div>
      <div class="window-titlebar-spacer"></div>
      <div class="window-titlebar-actions">
        <button class="window-titlebar-button menu" data-window-action="menu" type="button" aria-label="打开应用菜单" title="菜单"><span aria-hidden="true">…</span></button>
      </div>
      <div class="window-titlebar-controls">
        <button class="window-titlebar-button" data-window-action="minimize" type="button" aria-label="最小化窗口" title="最小化"><span aria-hidden="true">−</span></button>
        <button class="window-titlebar-button" data-window-action="maximize" type="button" aria-label="最大化窗口" title="最大化"><span aria-hidden="true">□</span></button>
        <button class="window-titlebar-button close" data-window-action="close" type="button" aria-label="关闭窗口" title="关闭"><span aria-hidden="true">×</span></button>
      </div>
    </header>
    <main class="setup-shell">
      <header class="brand-row">
        <span class="brand-mark" aria-hidden="true">C</span>
        <div>
          <h1>Celery Web Speak</h1>
          <p>桌面客户端</p>
        </div>
      </header>

      <section class="setup-content" aria-labelledby="setup-title">
        <div class="section-heading">
          <h2 id="setup-title">连接服务器</h2>
          <span id="version" class="version"></span>
        </div>

        <form id="server-form" novalidate>
          <label for="server-url">服务器地址</label>
          <div class="url-input-wrap">
            <input
              id="server-url"
              name="serverUrl"
              type="url"
              inputmode="url"
              autocomplete="url"
              spellcheck="false"
              placeholder="https://voice.example.com"
              required
            />
          </div>
          <div id="status" class="status" role="status" aria-live="polite" hidden></div>

          <div class="actions">
            <button id="cancel-button" class="button secondary" type="button" hidden>取消</button>
            <button id="force-button" class="button warning" type="button" hidden>仍然进入</button>
            <button id="submit-button" class="button primary" type="submit">验证并进入</button>
          </div>
        </form>
      </section>
    </main>
    <script src="./window-chrome.js"></script>
    <script src="./setup.js"></script>
  </body>
</html>
