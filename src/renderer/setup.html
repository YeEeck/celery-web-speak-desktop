<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>Celery Web Speak</title>
    <link rel="stylesheet" href="./setup.css" />
  </head>
  <body>
    <main class="setup-shell">
      <header class="brand-row">
        <span class="brand-mark" aria-hidden="true">C</span>
        <div>
          <h1>Celery Web Speak</h1>
          <p>桌面客户端</p>
        </div>
      </header>

      <section class="setup-content" aria-labelledby="setup-title">
        <div class="section-heading">
          <h2 id="setup-title">连接服务器</h2>
          <span id="version" class="version"></span>
        </div>

        <form id="server-form" novalidate>
          <label for="server-url">服务器地址</label>
          <div class="url-input-wrap">
            <input
              id="server-url"
              name="serverUrl"
              type="url"
              inputmode="url"
              autocomplete="url"
              spellcheck="false"
              placeholder="https://voice.example.com"
              required
            />
          </div>
          <p class="field-hint">使用完整的 HTTP 或 HTTPS 地址，服务器需部署在根路径。</p>

          <div class="security-notice">
            <span class="notice-mark" aria-hidden="true">!</span>
            <p>桌面客户端将忽略服务器证书错误。HTTP 地址会在重启后获得麦克风能力。</p>
          </div>

          <div id="status" class="status" role="status" aria-live="polite" hidden></div>

          <div class="actions">
            <button id="cancel-button" class="button secondary" type="button" hidden>取消</button>
            <button id="force-button" class="button warning" type="button" hidden>仍然进入</button>
            <button id="submit-button" class="button primary" type="submit">验证并进入</button>
          </div>
        </form>
      </section>
    </main>
    <script src="./setup.js"></script>
  </body>
</html>
