<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Celery Web Speak</title>
    <link rel="stylesheet" href="./window-chrome.css" />
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <header class="window-titlebar" aria-label="应用标题栏">
      <div class="window-titlebar-brand">
        <span class="window-titlebar-mark" aria-hidden="true">C</span>
        <span class="window-titlebar-name">Celery Web Speak</span>
      </div>
      <div class="window-titlebar-spacer"></div>
      <div class="window-titlebar-actions">
        <button class="window-titlebar-button menu" data-window-action="menu" type="button" aria-label="打开应用菜单" title="菜单"><span aria-hidden="true">…</span></button>
      </div>
      <div class="window-titlebar-controls">
        <button class="window-titlebar-button" data-window-action="minimize" type="button" aria-label="最小化窗口" title="最小化"><span aria-hidden="true">−</span></button>
        <button class="window-titlebar-button" data-window-action="maximize" type="button" aria-label="最大化窗口" title="最大化"><span aria-hidden="true">□</span></button>
        <button class="window-titlebar-button close" data-window-action="close" type="button" aria-label="关闭窗口" title="关闭"><span aria-hidden="true">×</span></button>
      </div>
    </header>
    <script src="./window-chrome.js"></script>
  </body>
</html>
